
name: Build NxF Legacy Bridge APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project ZIP
        run: |
          unzip -q NxF-Legacy-Bridge-Source.zip -d extracted

      - name: Build Android APK
        working-directory: extracted/NxF-Legacy-Bridge
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NxF-Legacy-Bridge-APK
          path: extracted/NxF-Legacy-Bridge/app/build/outputs/apk/debug/app-debug.apk
